<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 776" width="1240" height="776" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Connecting the S1 port to a Raspberry Pi running openZmeter</title>
<desc id="d">The S1 socket (left) of the Fluvius digital meter is connected with an FTDI USB-RS422-WE cable to a USB port of a Raspberry Pi 4. Socket seen from the front, latch notch at the top, pin 1 at the right. Pin 3 GND to black, pin 4 BUS minus to white, pin 5 BUS plus to yellow. Other wires are not connected.</desc>
