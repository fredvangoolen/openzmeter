<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="Imgs/favicon.ico" />
    <title>openZmeter | Login</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: sans-serif;
      }      
      body, html {
        display: table;
        position: absolute;
        height: 100%;
        width: 100%;
        background-color: #474544;
        background-image: none;
      }   
      .card {
        max-width: 350px;
        background-color: #F7F7F7;
        padding: 40px 40px 10px 40px;
        margin: auto;
      }  
      .container {
        display: table-cell;
        vertical-align: middle;
        width: 100%;
        position: relative;
        z-index: 10;
        margin-right: auto;
        margin-left: auto;
        padding-left: 15px;
        padding-right: 15px;
      }
      @media (min-width: 1200px) {
        .container {
          width: 1170px;
        }
      }
      @media (min-width: 992px){
        .container {
          width: 970px;
        }
      }
      @media (min-width: 768px){
        .container {
          width: 750px;
        }
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-control {
        display: block;
        width: 100%;
        height: 34px;
        padding: 6px 12px;
        font-size: 14px;
        line-height: 1.42857143;
        color: #555;
        background-color: #fff;
        background-image: none;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-shadow: inset 0 1px 1px rgba(0,0,0,0.075);
        transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
      }
      .btn {
        background-color: #E8701C;
        font-weight: 700;
        color: #F7F7F7;
        display: inline-block;
        text-align: center;
        vertical-align: middle;
        touch-action: manipulation;
        cursor: pointer;
        border: 1px solid transparent;
        white-space: nowrap;
        padding: 6px 12px;
        font-size: 14px;
        line-height: 1.42857143;
        border-radius: 4px;
        user-select: none;
        width: 100%
      }
      .btn.disabled {
        cursor: not-allowed;
        opacity: .65;
      }
      .panel-footer {
        text-align: right;
        margin-top: 5px;
      }
      .alert {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div>
          <embed src="Imgs/Logo.svg" style="width:100%" type="image/svg+xml" />
          <form method="post">
            <div class="form-group">
              <input type="text" id="username" class="form-control" placeholder="Username" required autofocus>
            </div>
            <div class="form-group">
              <input type="password" id="password" class="form-control" placeholder="Password" required>
            </div>
            <button class="btn disabled" type="submit">Sign in</button>
          </form>
        </div>
        <div class="alert alert-success text-center" style="display:none">
          <i class="fa fa-check"></i> Welcome again, redirecting...
        </div>
        <div class="alert alert-danger text-center" style="display:none">
          <i class="fa fa-times"></i> Wrong password!
        </div>
        <div class="panel-footer"><img src="./Imgs/zRed.png"></div>
      </div>
    </div>
  </body>
</html>
