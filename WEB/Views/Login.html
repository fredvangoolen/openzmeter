<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="shortcut icon" href="favicon.ico" />
    <base href="/">
    <title>openZmeter | Login</title>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css">
    <link href="lib/metisMenu/metisMenu.min.css" rel="stylesheet">
    <link href="lib/font-awesome/font-awesome.min.css" rel="stylesheet" type="text/css"/>
    <link href="lib/jquery.lineProgressbar/jquery.lineProgressbar.css" rel="stylesheet" type="text/css"/>
    <link href="css/common.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/login.css" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="card card-container">
        <img id="profile-img" class="profile-img-card" src="img/logo.png" />
        <p id="profile-name" class="profile-name-card"></p>
        <form class="form-signin" method="post">
          <span id="reauth-email" class="reauth-email"></span>
          <input name="username" type="text" id="user" class="form-control" placeholder="Username" required autofocus>
          <input name="password" type="password" id="password" class="form-control" placeholder="Password" required>
          <button class="btn btn-lg btn-primary btn-block btn-signin" type="submit">Sign in</button>
          <div class="alert alert-success text-center" style="display:none">
            <i class="fa fa-check"></i> Welcome again, redirecting...
          </div>
          <div class="alert alert-danger text-center" style="display:none">
            <i class="fa fa-times"></i> Wrong user/password combination
          </div>
        </form><!-- /form -->
      </div><!-- /card-container -->
    </div><!-- /container -->
    <script src="lib/jquery.min.js"></script>
    <script src="js/utils.js"></script>

    <script src="lib/bootstrap/js/bootstrap.min.js"></script>

  </body>
</html>
