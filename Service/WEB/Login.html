<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="shortcut icon" href="favicon.ico" />
    <title>openZmeter | Login</title>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.css">
    <link href="lib/metisMenu/metisMenu.css" rel="stylesheet">
    <link href="lib/font-awesome/font-awesome.css" rel="stylesheet" type="text/css"/>
    <link href="lib/jquery.lineProgressbar/jquery.lineProgressbar.css" rel="stylesheet" type="text/css"/>
    <link href="openZmeter.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body, html {
          display: table;
          position: absolute;
          height: 100%;
          width: 100%;
          background-color: #6da1c9;
      }

      .container{
          display: table-cell;
          vertical-align: middle;
          width: 100%;
      }

      .card-container.card {
          max-width: 350px;
          padding: 40px 40px;
      }

      .btn {
          font-weight: 700;
          height: 36px;
          -moz-user-select: none;
          -webkit-user-select: none;
          user-select: none;
          cursor: default;
      }

      .card {
          background-color: #F7F7F7;
          padding: 20px 25px 30px;
          margin: 0 auto 25px;
          margin-top: 50px;
          -moz-border-radius: 2px;
          -webkit-border-radius: 2px;
          border-radius: 2px;
          -moz-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
          -webkit-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
          box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
      }

      .profile-img-card {
          width: 96px;
          height: 96px;
          margin: 0 auto 10px;
          display: block;
          -moz-border-radius: 50%;
          -webkit-border-radius: 50%;
          border-radius: 50%;
      }

      .reauth-email {
          display: block;
          color: #404040;
          line-height: 2;
          margin-bottom: 10px;
          font-size: 14px;
          text-align: center;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          -moz-box-sizing: border-box;
          -webkit-box-sizing: border-box;
          box-sizing: border-box;
      }

      .form-signin input[type=email],
      .form-signin input[type=password],
      .form-signin input[type=text],
      .form-signin button {
          width: 100%;
          display: block;
          margin-bottom: 10px;
          z-index: 1;
          position: relative;
          -moz-box-sizing: border-box;
          -webkit-box-sizing: border-box;
          box-sizing: border-box;
      }

      .form-signin .form-control:focus {
          border-color: rgb(104, 145, 162);
          outline: 0;
          -webkit-box-shadow: inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgb(104, 145, 162);
          box-shadow: inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgb(104, 145, 162);
      }

      .btn.btn-signin {
          padding: 0px;
          font-weight: 700;
          font-size: 14px;
          height: 36px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card card-container">
        <embed src="Logo.svg" style="width:100%" type="image/svg+xml" />
        <p id="profile-name" class="profile-name-card"></p>
        <form class="form-signin" method="post">
          <span id="reauth-email" class="reauth-email"></span>
          <input name="password" type="password" id="password" class="form-control" placeholder="Password" required autofocus>
          <button class="btn btn-lg btn-primary btn-block btn-signin" type="submit">Sign in</button>
          <div class="alert alert-success text-center" style="display:none">
            <i class="fa fa-check"></i> Welcome again, redirecting...
          </div>
          <div class="alert alert-danger text-center" style="display:none">
            <i class="fa fa-times"></i> Wrong password!
          </div>
        </form>
      </div>
    </div>
    <script src="lib/jquery/jquery.js"></script>
    <script src="Login.js"></script>
  </body>
</html>
