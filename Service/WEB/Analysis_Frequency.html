<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content=""/>
    <meta name="author" content="zRed"/>
    <base href="/">
    <link rel="shortcut icon" href="favicon.ico"/>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="lib/metisMenu/metisMenu.min.css"/>
    <link rel="stylesheet" href="lib/font-awesome/css/font-awesome.min.css"/>
    <link rel="stylesheet" href="lib/jquery.lineProgressbar/jquery.lineProgressbar.css" type="text/css"/>
    <link rel="stylesheet" href="lib/offline/offline.css" type="text/css"/>
    <link rel="stylesheet" href="css/common.css"/>
    <title>openZmeter - Analysys - Frequency</title>
  </head>
  <body>
    <div id="DisableDiv" class="overlay"></div>
    <nav class="navbar navbar-default navbar-fixed-top" id="Header"></nav>
    <div class="modal fade" id="aggreg_modal" tabindex="-1" role="dialog" data-backdrop='static'>
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title" id="myModalLabel"><i class="fa fa-exclamation-triangle"></i> Aggregation change...</h3>
          </div>
          <div class="modal-body">
            <p>Requested aggregation returns to much points.<br/>Zoom in and try again.</p><p>Aggregation period has been changed to the lowest allowed.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-success" id="aggreg_modal_close"><span class="glyphicon glyphicon-ok"></span>  Continue</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal" id="GraphDialog" tabindex="1" role="dialog" data-backdrop='static'>
      <div class="modal-dialog" style="width: 100%; height: 100%; padding: 10px; margin: 0px">
        <div class="modal-content" style="height: 100%" id="GraphDialogContents">
          <div class="modal-header">
            <div class="pull-left">
            <h3 class="modal-title" id="GraphDialogTitle"></h3>
            </div>
            <div class="pull-right">
              <button type="button" class="btn btn-default btn-sm" id="GraphDialogClose">
                <i class="fa fa-compress"></i>
              </button>
            </div>
            <div class="clearfix"></div>
          </div>
          <div class="modal-body" id="GraphDialogBody" style="padding-top: 0px"></div>
        </div>
      </div>
    </div>
    <div id="wrapper">
      <div id="page-wrapper">
        <div class="row">
          <div class="col-lg-12">
            <div class="panel panel-green">
              <div id="FrequencySpinner" class="spinnerdiv"></div>
              <div class="panel-heading">
                <span class="huge-small">Frequency</span>
                <div class="pull-right">
                  <span class="small"></span><br>
                  <div class="btn-group">
                    <button type="button" class="btn btn-default btn-xs" id="btnFrequencyNow"      data-toggle="tooltip" title="Move to most recent samples and update in real time"><i class="fa fa-play"></i></button>
                    <button type="button" class="btn btn-default btn-xs" id="btnExportFrequency"   data-toggle="tooltip" title="Export data to CSV file"><i class="fa fa-table fa-fw"></i></button>
                    <button type="button" class="btn btn-default btn-xs" id="btnMaximizeFrequency" data-toggle="tooltip" title="Maximize graph"><i class="fa fa-expand"></i></button>
                  </div>
                </div>
                <div class="pull-right">&nbsp;</div>
                <div class="pull-right">
                  <span class="small">Time scale:</span><br>
                  <div class="btn-group">
                    <button type="button" class="btn btn-default btn-xs" id="btnShowFrequencyYear"  data-toggle="tooltip" title="Zoom the graph to one year, keeping current aggregation level while possible">Year</button>
                    <button type="button" class="btn btn-default btn-xs" id="btnShowFrequencyMonth" data-toggle="tooltip" title="Zoom the graph to one month, keeping current aggregation level while possible">Month</button>
                    <button type="button" class="btn btn-default btn-xs" id="btnShowFrequencyWeek"  data-toggle="tooltip" title="Zoom the graph to one week, keeping current aggregation level while possible">Week</button>
                    <button type="button" class="btn btn-default btn-xs" id="btnShowFrequencyDay"   data-toggle="tooltip" title="Zoom the graph to one day, keeping current aggregation level while possible">Day</button>
                  </div>
                </div>
                <div class="pull-right">&nbsp;</div>
                <div class="pull-right">
                  <span class="small">Aggregation scale:</span><br>
                  <div class="btn-group">
                    <button class="btn btn-default btn-xs" id="btnFrequency3S"  data-toggle="tooltip" title="Fetch graph from 3 seconds aggregation">3 Seconds</button>
                    <button class="btn btn-default btn-xs" id="btnFrequency1M"  data-toggle="tooltip" title="Fetch graph from 1 minute aggregation">1 Minute</button>
                    <button class="btn btn-default btn-xs" id="btnFrequency10M" data-toggle="tooltip" title="Fetch graph from 10 minutes aggregation">10 Minutes</button>
                    <button class="btn btn-default btn-xs" id="btnFrequency1H"  data-toggle="tooltip" title="Fetch graph from 1 hour aggregation">1 Hour</button>
                  </div>
                </div>
                <span class="clearfix"> </span> 
              </div>
              <div class="row">
                <div class="col-md-6 col-lg-3">
                  <div class="row">
                    <div class="col-xs-4 col-md-12">
                      <div class="panel panel-lightgreen-info" id="FreqAvgPanel">
                        <h4 id="labelFrequencyPeriodAVG">Loading...</h4>
                        <span class="huge-small-unit" id="labelFrequencyCurrentAVG">?</span><em class="huge-small-unit">&nbsp;Hz</em>
                        <p><span id="labelFrequencyPrevPeriodAVG"></span> <span id="labelFrequencyPrevAVG">?</span><em class="small">&nbsp;Hz</em></p>
                      </div>
                    </div>
                    <div class="col-xs-4 col-md-12">
                      <div class="panel panel-lightgreen-info" id="FreqMaxPanel">
                        <h4 id="labelFrequencyPeriodMAX">Loading...</h4>
                        <span class="huge-small-unit" id="labelFrequencyCurrentMAX">?</span><em class="huge-small-unit">&nbsp;Hz</em><br/>
                        <p><span id="labelFrequencyPrevPeriodMAX"></span> <span id="labelFrequencyPrevMAX">?</span><em class="small">&nbsp;Hz</em></p>
                      </div>
                    </div>
                    <div class="col-xs-4 col-md-12">
                      <div class="panel panel-lightgreen-info" id="FreqMinPanel">
                        <h4 id="labelFrequencyPeriodMIN">Loading...</h4>  
                        <span class="huge-small-unit" id="labelFrequencyCurrentMIN">?</span><em class="huge-small-unit">&nbsp;Hz</em><br/>
                        <p><span id="labelFrequencyPrevPeriodMIN"></span> <span id="labelFrequencyPrevMIN">?</span><em class="small">&nbsp;Hz</em></p>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="col col-md-6 col-lg-9" id="FrequencyCol">
                  <div id="FrequencyMaximizeDiv">
                    <div style="padding:5px">
                      <div style="display:inline-block" id="FrequencyAggregation">Loading data...</div>
                      <div id="FrequencyLegend" style="float: right"></div>
                    </div>
                    <div id="FrequencyChart" class="chart big_chart"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="lib/metisMenu/metisMenu.min.js"></script>
    <script src="lib/spin.js/spin.min.js"></script>
    <script src="lib/dygraph/dygraph.min.js"></script>
    <script src="lib/dygraph/crosshair.js"></script>
    <script src="lib/dygraph/dygraph-interaction.js"></script>
    <script src="lib/offline/offline.min.js"></script>
    <script src="lib/momentjs/moment.js"></script>
    <script src="lib/momentjs/moment-duration-format.js"></script>    
    <script src="openZmeter.js"></script>
    <script src="Analysis_Frequency.js"></script>
    <script>
      StartPageLoad();
    </script>
  </body>
</html>
