<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content=""/>
    <meta name="author" content="zRed"/>
    <base href="/">
    <link rel="shortcut icon" href="favicon.ico"/>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="lib/datatables/css/dataTables.responsive.css" />
    <link rel="stylesheet" href="lib/datatables/css/dataTables.bootstrap.css" />
    <link rel="stylesheet" href="lib/metisMenu/metisMenu.min.css"/>
    <link rel="stylesheet" href="lib/font-awesome/css/font-awesome.min.css"/>
    <link rel="stylesheet" href="lib/jquery.lineProgressbar/jquery.lineProgressbar.css" type="text/css"/>
    <link rel="stylesheet" href="lib/offline/offline.css" type="text/css"/>
    <link rel="stylesheet" href="lib/bootstrap-year-calendar/bootstrap-year-calendar.min.css" type="text/css"/>
    <link rel="stylesheet" href="lib/qtip2/jquery.qtip.min.css" type="text/css"/>
    <link rel="stylesheet" href="css/common.css"/>
    <title>openZmeter - Stats</title>
  </head>
  <body>
    <div id="DisableDiv" class="overlay"></div>
    <nav class="navbar navbar-default navbar-fixed-top" id="Header"></nav>
    <div id="wrapper">
      <div id="page-wrapper">
        <div class="row">
          <div class="col-lg-12">
            <div class="panel panel-yellow">
              <div id="StatsSpinner" class="spinnerdiv"></div>
              <div class="panel-heading">
                <span class="huge">Anual stats</span>
                <div class="pull-right">
                  <span class="small">Phase:</span><br>
                  <div class="btn-group">
                    <button type="button" class="btn btn-default btn-xs disabled" id="btnShowVoltageALLPhase" data-toggle="tooltip" title="Show sum of all phases">ALL</button>
                    <button type="button" class="btn btn-default btn-xs disabled" id="btnShowVoltageRPhase" data-toggle="tooltip" title="Show phase R">R</button>
                    <button type="button" class="btn btn-default btn-xs disabled" id="btnShowVoltageSPhase" data-toggle="tooltip" title="Show phase S">S</button>
                    <button type="button" class="btn btn-default btn-xs disabled" id="btnShowVoltageTPhase" data-toggle="tooltip" title="Show phase T">T</button>
                  </div>
                </div>
                <div class="pull-right">&nbsp;</div>
                <div class="pull-right">
                  <span class="small">Year:</span><br>
                  <div class="btn-group" id="YearSelector">
                  </div>
                </div>
                <span class="clearfix"> </span>
              </div>
              <div class="row">
                <div class="col-md-12 col-lg-6">
                  <div class="panel panel-default" style="margin: 5px"> 
                    <div class="panel-heading">
                      <span class="glyphicon glyphicon-calendar"></span> By day
                    </div>
                    <div id="Calendar"></div>
                  </div>
                  <div class="panel panel-default" style="margin: 5px">
                    <div class="panel-heading">
                      <i class="fa fa-calendar-o" aria-hidden="true"></i> By month
                    </div>
                    <div style="padding: 5px">
                      <table id="MonthTable" class="table small table-striped table-responsive">
                        <thead>
                          <tr>
                            <th style="width: 30px">Month</th><th style="width: 40px">From</th><th style="width: 40px">To</th><th>Energy</th>
                          </tr>
                        </thead>
                        <tbody>
                        </tbody>
                      </table>
                    </div>
                  </div>
                  <div class="panel panel-default" style="margin: 5px">
                    <div class="panel-heading">
                      <i class="fa fa-ellipsis-h" aria-hidden="true"></i> By week day
                    </div>
                    <div style="padding: 5px">
                      <table id="WeekDayTable" class="table small table-striped table-responsive">
                        <thead>
                          <tr>
                            <th style="width: 30px">Day</th><th>Energy</th>
                          </tr>
                        </thead>
                        <tbody>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
                <div class="col-md-12 col-lg-6">
                  <div class="panel panel-default" style="margin: 5px">
                    <div class="panel-heading">
                      <i class="fa fa-bars" aria-hidden="true"></i> By week
                    </div>
                    <div style="padding: 5px">
                      <table id="WeekTable" class="table small table-striped table-responsive">
                        <thead>
                          <tr>
                            <th style="width: 30px">Week</th><th style="width: 40px">From</th><th style="width: 40px">To</th><th>Weekdays</th><th>Weekend</th><th>Total</th>
                          </tr>
                        </thead>
                        <tbody>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="lib/metisMenu/metisMenu.min.js"></script>
    <script src="lib/spin.js/spin.min.js"></script>
    <script src="lib/d3/d3.v3.min.js"></script>
    <script src="lib/d3/colorbrewer.js"></script>
    <script src="lib/dc.js/crossfilter.js"></script>
    <script src="lib/dc.js/dc.min.js"></script>
    <script src="lib/d3-tip/d3-tip.min.js"></script>
    <script src="lib/offline/offline.min.js"></script>
    <script src="lib/bootstrap-year-calendar/bootstrap-year-calendar.min.js"></script>
    <script src="lib/datatables/js/jquery.dataTables.min.js"></script>
    <script src="lib/datatables/js/dataTables.responsive.min.js"></script>
    <script src="lib/datatables/js/dataTables.bootstrap.js"></script>
    <script src="openZmeter.js"></script>
    <script src="lib/momentjs/moment.js"></script>
    <script src="lib/momentjs/moment-duration-format.js"></script>
    <script src="lib/qtip2/jquery.qtip.min.js"></script>
    <script src="Stats.js"></script>
    <script>
      StartPageLoad();
    </script>
  </body>
</html>
