<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content=""/>
    <meta name="author" content="zRed"/>
    <base href="/">
    <link rel="shortcut icon" href="favicon.ico"/>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="lib/datatables/css/dataTables.responsive.css" />
    <link rel="stylesheet" href="lib/datatables/css/dataTables.bootstrap.css" />
    <link rel="stylesheet" href="lib/metisMenu/metisMenu.min.css"/>
    <link rel="stylesheet" href="lib/font-awesome/css/font-awesome.min.css"/>
    <link rel="stylesheet" href="lib/jquery.lineProgressbar/jquery.lineProgressbar.css" type="text/css"/>
    <link rel="stylesheet" href="lib/offline/offline.css" type="text/css"/>
    <link rel="stylesheet" href="lib/bootstrap-year-calendar/bootstrap-year-calendar.min.css" type="text/css"/>
    <link rel="stylesheet" href="lib/qtip2/jquery.qtip.min.css" type="text/css"/>
    <link rel="stylesheet" href="css/common.css"/>
    <title>openZmeter - Stats</title>
  </head>
  <body>
    <div id="DisableDiv" class="overlay"></div>
    <nav class="navbar navbar-default navbar-fixed-top" id="Header"></nav>
    <div id="wrapper">
      <div id="page-wrapper">
        <div class="row">
          <div class="col-lg-12">
            <div class="panel panel-yellow">
              <div id="StatsSpinner" class="spinnerdiv"></div>
              <div class="panel-heading">
                <span class="huge">Anual stats</span>
                <div class="pull-right">
                  <span class="small">Calc period:</span><br>
                  <div class="btn-group">                    
                    <button type="button" class="btn btn-default btn-xs" id="btnShowVoltageMonth" data-toggle="tooltip" title="Zoom the graph to one month, keeping current aggregation level while possible">Month</button>
                    <button type="button" class="btn btn-default btn-xs" id="btnShowVoltageWeek"  data-toggle="tooltip" title="Zoom the graph to one week, keeping current aggregation level while possible">Week</button>
                    <button type="button" class="btn btn-default btn-xs" id="btnShowVoltageDay"   data-toggle="tooltip" title="Zoom the graph to one day, keeping current aggregation level while possible">Day</button>
                  </div>
                </div>
                <div class="pull-right">&nbsp;</div>
                <div class="pull-right">
                  <span class="small">Phase:</span><br>
                  <div class="btn-group">
                    <button type="button" class="btn btn-default btn-xs disabled" id="btnShowVoltageTPhase" data-toggle="tooltip" title="Show phase T">ALL</button>
                    <button type="button" class="btn btn-default btn-xs disabled" id="btnShowVoltageRPhase" data-toggle="tooltip" title="Show phase R">R</button>
                    <button type="button" class="btn btn-default btn-xs disabled" id="btnShowVoltageSPhase" data-toggle="tooltip" title="Show phase S">S</button>
                    <button type="button" class="btn btn-default btn-xs disabled" id="btnShowVoltageTPhase" data-toggle="tooltip" title="Show phase T">T</button>
                  </div>
                </div>
                <span class="clearfix"> </span>
              </div>
              <div id="DayPanel">
                <div id="Calendar"></div>
              </div>
              <div id="WeekPanel" style="padding: 5px">
                <table id="WeekTable" class="table small table-striped table-responsive" cellspacing="0" width="100%">
                  <thead>
                    <tr>
                      <th>Week</th><th>From</th><th>To</th><th>Weekdays</th><th>Weekend</th><th>Total</th>
                    </tr>
                  </thead>
                  <tbody>
                  </tbody>
                </table>
              </div>
              <div id="MonthPanel" style="padding: 5px">
                <table id="MonthTable" class="table small table-striped table-responsive" cellspacing="0" width="100%">
                  <thead>
                    <tr>
                      <th>Month</th><th>From</th><th>To</th><th>Weekdays</th><th>Weekend</th><th>Total</th>
                    </tr>
                  </thead>
                  <tbody>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>













        <div class="row">
          <div class="col-lg-12">
            <span class="h2">Stats</span>
            <div class="pull-right">
              <a class="btn btn-primary" href="javascript:resetCharts();"><i class="fa fa-bolt fa-eraser"></i>  Reset All</a>
            </div>
            <hr>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <div class="panel panel-yellow">
              <div class="panel-heading">
                <i class="fa fa-bar-chart fa-fw"></i> Energy usage
                <div class="pull-right">
                  <div class="btn-group" data-toggle="buttons">
                    <label class="btn btn-default btn-sm">
                      <input type="radio" name="date_chart_range" value="today"/> Today
                    </label>
                    <label class="btn btn-default btn-sm">
                      <input type="radio" name="date_chart_range" value="yesterday"/> Yesterday
                    </label>
                    <label class="btn btn-default btn-sm active">
                      <input type="radio" name="date_chart_range" value="week"  checked="checked"/> This week
                    </label>
                    <label class="btn btn-default btn-sm">
                      <input type="radio" name="date_chart_range" value="month"/> This month
                    </label>
                  </div>
                </div>
              </div>
              <div class="panel-body">
                <div id='date_chart'></div>
                <div class="chart-range" id='date_selector_chart'></div>
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <h3 class="text-left">Energy usage by groups
            </h3>
            <div class="row">
              <div class="col-md-6">
                <h4 class="text-center">By weekday</h4>
                <div id='weekday_chart'></div>
              </div>
              <div class="col-md-6">
                <h4 class="text-center">By day of month</h4>
                <div id='monthday_chart'></div>
              </div>
              <div class="col-md-12">
                <h4 class="text-center">By week</h4>
                <div id='week_chart'></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="lib/metisMenu/metisMenu.min.js"></script>
    <script src="lib/spin.js/spin.min.js"></script>
    <script src="lib/d3/d3.v3.min.js"></script>
    <script src="lib/d3/colorbrewer.js"></script>
    <script src="lib/dc.js/crossfilter.js"></script>
    <script src="lib/dc.js/dc.min.js"></script>
    <script src="lib/d3-tip/d3-tip.min.js"></script>
    <script src="lib/offline/offline.min.js"></script>
    <script src="lib/bootstrap-year-calendar/bootstrap-year-calendar.min.js"></script>
    <script src="lib/datatables/js/jquery.dataTables.min.js"></script>
    <script src="lib/datatables/js/dataTables.responsive.min.js"></script>
    <script src="lib/datatables/js/dataTables.bootstrap.js"></script>
    <script src="openZmeter.js"></script>
    <script src="lib/momentjs/moment.js"></script>
    <script src="lib/momentjs/moment-duration-format.js"></script>
    <script src="lib/qtip2/jquery.qtip.min.js"></script>
    <script src="Stats.js"></script>
    <script>
      StartPageLoad();
    </script>
  </body>
</html>
