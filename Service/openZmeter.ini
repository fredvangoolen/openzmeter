[global]                                                            
httpPort = 8081                                                                                                                                                                                                                                                        
listen  = /var/run/openZmeter.sock
log     = openZmeter.log
pid     = openZmeter.pid

[events]
onStart = /etc/openZmeter.d/eventStart.sh
onEnd   = /etc/openZmeter,d/eventEnd.sh
                                                                                                                                                                                                                                                                                                                            
[database]                                                          
host    = 127.0.0.1
port    = 5432
database= ozm2
user    = openzmeter
pass    = swordfish

[electrical]
nominal_frequency = 50
nominal_voltage   = 230

[device]
type           = VirtualMono
name           = VirtualDevice

[device]
type           = Mono
name           = RealDevice
serial         = 25FFB6602756158491734076
voltage_gain   = 503
voltage_offset = 0
current_gain   = 30
current_offset = 0
