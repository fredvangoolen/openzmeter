<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <base href="/">
    <link rel="shortcut icon" href="favicon.ico"/>
    <title>openZmeter - Stats - Heatmap</title>
    <script src="lib/pace.min.js"></script>
    <link rel="stylesheet" href="lib/pace.min.css">    
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" href="lib/datatables/css/dataTables.bootstrap.css" />
    <link rel="stylesheet" href="lib/sidenav/sidenav.min.css"/>
    <link rel="stylesheet" href="lib/font-awesome/css/font-awesome.css"/>
    <link rel="stylesheet" href="lib/jquery.lineProgressbar/jquery.lineProgressbar.css" type="text/css"/>
    <link rel="stylesheet" href="lib/offline.min.css" type="text/css"/>
    <link rel="stylesheet" href="lib/bootstrap-year-calendar/bootstrap-year-calendar.css" type="text/css"/>
    <link rel="stylesheet" href="openZmeter.css"/>
  </head>
  <body onload="StartPageLoad()">
    <span data-load-block="Header_Block"></span>
    <div id="wrapper">
      <div class="row">
        <div class="col-lg-12">
          <div class="panel panel-active-energy">
            <div id="StatsSpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <span class="huge header-text">Energy Heatmap</span>
              <div class="header-buttons">
                <div class="btn-group" data-load-block="Years_Block"></div>
                <div class="btn-group" data-load-block="BlockSize_Block"></div>
                <div class="btn-group" data-load-block="PhaseV_Block" id="groupEnergyPhases"></div>
              </div>
              <span class="clearfix"> </span>
            </div>
            <div class="panel-body">
              <table id="HeatMap" style="width: 100%; font-size: 9px; text-align:center; table-layout: fixed">
                <thead style="font-weight: bold">
                  <tr>
                    <td style="width:16px">Day</td>
                    <td style="width:54px">Date</td>
                    <td colspan="6" style="border-left: 1px solid #888">00</td>
                    <td colspan="6" style="border-left: 1px solid #888">01</td>
                    <td colspan="6" style="border-left: 1px solid #888">02</td>
                    <td colspan="6" style="border-left: 1px solid #888">03</td>
                    <td colspan="6" style="border-left: 1px solid #888">04</td>
                    <td colspan="6" style="border-left: 1px solid #888">05</td>
                    <td colspan="6" style="border-left: 1px solid #888">06</td>
                    <td colspan="6" style="border-left: 1px solid #888">07</td>
                    <td colspan="6" style="border-left: 1px solid #888">08</td>
                    <td colspan="6" style="border-left: 1px solid #888">09</td>
                    <td colspan="6" style="border-left: 1px solid #888">10</td>
                    <td colspan="6" style="border-left: 1px solid #888">11</td>
                    <td colspan="6" style="border-left: 1px solid #888">12</td>
                    <td colspan="6" style="border-left: 1px solid #888">13</td>
                    <td colspan="6" style="border-left: 1px solid #888">14</td>
                    <td colspan="6" style="border-left: 1px solid #888">15</td>
                    <td colspan="6" style="border-left: 1px solid #888">16</td>
                    <td colspan="6" style="border-left: 1px solid #888">17</td>
                    <td colspan="6" style="border-left: 1px solid #888">18</td>
                    <td colspan="6" style="border-left: 1px solid #888">19</td>
                    <td colspan="6" style="border-left: 1px solid #888">20</td>
                    <td colspan="6" style="border-left: 1px solid #888">21</td>
                    <td colspan="6" style="border-left: 1px solid #888">22</td>
                    <td colspan="6" style="border-left: 1px solid #888">23</td>
                  </tr>
                </thead>
                <tbody>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.js"></script>
    <script src="lib/sidenav/sidenav.min.js"></script>
    <script src="lib/spin.min.js"></script>
    <script src="lib/offline.min.js"></script>
    <script src="lib/bootstrap-year-calendar/bootstrap-year-calendar.js"></script>
    <script src="lib/datatables/js/jquery.dataTables.js"></script>
    <script src="lib/datatables/js/dataTables.bootstrap.js"></script>
    <script src="lib/momentjs/moment.js"></script>
    <script src="lib/momentjs/moment-duration-format.js"></script>
    <script src="lib/chroma.min.js"></script>
    <script src="openZmeter.js"></script>
    <script src="Stats_Heatmap.js"></script>
  </body>
</html>
