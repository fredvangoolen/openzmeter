<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <base href="/">
    <link rel="shortcut icon" href="favicon.ico"/>
    <title>openZmeter - Analysis - Current</title>
    <script src="lib/pace.min.js"></script>
    <link href="lib/pace.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" href="lib/datatables/css/dataTables.bootstrap.css" />
    <link rel="stylesheet" href="lib/sidenav/sidenav.min.css"/>
    <link rel="stylesheet" href="lib/font-awesome/css/font-awesome.css"/>
    <link rel="stylesheet" href="lib/jquery.lineProgressbar/jquery.lineProgressbar.css" type="text/css"/>
    <link rel="stylesheet" href="lib/offline.min.css" type="text/css"/>
    <link rel="stylesheet" href="lib/jquery.scrolling-tabs.min.css" type="text/css"/>
    <link rel="stylesheet" href="openZmeter.css"/>
  </head>
  <body onload="StartPageLoad()">
    <span data-load-block="Header_Block"></span>
    <span data-load-block="AggregWarningDialog"></span>
    <div class="modal" id="GraphDialog" tabindex="1" role="dialog" data-backdrop='static'>
      <div class="modal-dialog" style="width: 100%; height: 100%; padding: 10px; margin: 0px">
        <div class="modal-content" style="height: 100%" id="GraphDialogContents">
          <div class="modal-header">
            <div class="pull-left">
            <h3 class="modal-title" id="GraphDialogTitle"></h3>
            </div>
            <div class="pull-right">
              <button type="button" class="btn btn-default btn-sm" id="GraphDialogClose">
                <i class="fa fa-compress"></i>
              </button>
            </div>
            <div class="clearfix"></div>
          </div>
          <div class="modal-body" id="GraphDialogBody" style="padding-top: 0px"></div>
        </div>
      </div>
    </div>
    <div id="wrapper">
      <div class="row">
        <div class="col-lg-12">
          <div class="panel panel-current" id="CurrentPanel">
            <div id="CurrentSpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <div class="huge header-text">Current</div>
              <div class="header-buttons">
                <div class="btn-group" data-load-block="ScrollableAggreg_Block"></div>
                <div class="btn-group" data-load-block="ScrollableTime_Block"></div>
                <div class="btn-group" id="groupVoltagePhases" data-load-block="PhaseI_Block"></div>
                <div class="btn-group" data-load-block="GraphToolsPlay_Block"></div>
              </div>
              <span class="clearfix"> </span>
            </div>
            <div class="panel-body">
              <div class="row">
                <div class="col-md-6 col-lg-4 col-xl-3" id="panelCounters">
                  <div class="subpanel">
                    <div class="huge-small" id="labelCurrentAvgPrimary">Loading data...</div>
                    <div class="huge-small" id="labelCurrentAvgPrimaryValue">?</div>
                    <div><span id="labelCurrentAvgSecondary">Loading data...</span>&nbsp;<span id="labelCurrentAvgSecondaryValue"></span></div>
                  </div>
                  <div class="subpanel">
                    <div class="huge-small" id="labelCurrentMaxPrimary">Loading data...</div>
                    <div class="huge-small" id="labelCurrentMaxValue">?</div>
                    <div><span id="labelCurrentMaxSecondary">Loading data...</span>&nbsp;<span id="labelCurrentMaxSecondary"></span></div>
                  </div>
                  <div class="subpanel">
                    <div class="huge-small" id="labelCurrentMinPrimary">Loading data...</div>
                    <div class="huge-small" id="labelCurrentMinPrimaryValue">?</div>
                    <div><span id="labelCurrentMinSecondary">Loading data...</span>&nbsp;<span id="labelCurrentMinSecondaryValue"></span></div>
                  </div>
                </div>
                <div class="col-md-6 col-lg-8 col-xl-9" id="CurrentCol">
                  <div id="CurrentMaximizeDiv">
                    <div id="CurrentChart" class="chart big_chart"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <ul class="nav nav-tabs" id="DetailTabs">
            <li><a data-toggle="tab" href="#">Waveform</a></li>
            <li><a data-toggle="tab" href="#">Harmonics</a></li>
            <li><a data-toggle="tab" href="#">Evolution</a></li>
            <li><a data-toggle="tab" href="#">Advanced</a></li>
            <li><a data-toggle="tab" href="#">Parameters</a></li>
          </ul>
          <div class="panel panel-other">
            <div id="DetailSpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <div class="header-text" id="DetailTime"></div>
              <div id="LowWarning" class="title-warning hidden"><i class="fa fa-exclamation-triangle"></i> No current or current too low</div>
              <div class="header-buttons">
                <div class="btn-group" id="groupDetailPhasesSingle" data-load-block="PhaseI_Block"></div>
                <div class="btn-group" id="groupDetailPhasesMulti" data-load-block="PhaseI_Block"></div>
                <div class="btn-group">
                  <button type="button" class="btn btn-default btn-xs" id="btnShowDetail1Harmonic" data-toggle="tooltip" title="Show/hide 1st harmonic">1st harmonic</button>
                  <button type="button" class="btn btn-default btn-xs" id="btnShowDetailVoltageAndCurrent" data-toggle="tooltip" title="Show/hide current">Current</button>
                  <button type="button" class="btn btn-default btn-xs" id="btnShowDetailLog" data-toggle="tooltip" title="Use logarithm scale">Log</button>
                </div>               
                <div class="btn-group">
                  <button type="button" class="btn btn-default btn-xs" id="btnMaximizeDetail" data-toggle="tooltip" title="Maximize current view"><i class="fa fa-expand"></i></button>
                  <button type="button" class="btn btn-default btn-xs" id="btnExportDetail"   data-toggle="tooltip" title="Export data to CSV file"><i class="fa fa-table fa-fw"></i></button>
                  <button type="button" class="btn btn-default btn-xs" id="btnPauseDetail"    data-toggle="tooltip" title="Stop fetching new data"><span class="glyphicon glyphicon-pause"></span></button>
                </div>                
              </div>
              <span class="clearfix"> </span>
            </div>
            <div class="panel-body" id="DetailDivs">
              <div id="WaveformPanel">
                <div id="WaveformMaximize">
                  <div id="WaveformChart" class="chart big_chart"></div>
                </div>
              </div>
              <div id="HarmonicsPanel">
                <div id="HarmonicsMaximize">
                  <div id="HarmonicsChart" class="chart big_chart"></div>
                </div>
              </div>
              <div id="EvolutionPanel">
              </div>
              <div id="FFTPanel">
                <div id="FFTMaximize">
                  <div id="FFTChart" class="chart big_chart"></div>
                </div>
              </div>
              <div id="ParametersPanel">
                <div class="row">
                  <div class="col-md-6 col-lg-5 col-xl-4 panel-voltage panel-noborder">
                    <div class="subpanel"  style="padding-bottom: 5px">
                      <div>Power Factor</div>
                      <div class="huge-small" id="PowerFactorNow">?</div>
                    </div>
                  </div>
                  <div class="col-md-6 col-lg-7 col-xl-8">
                    <div id="PowerFactorChart"></div>       
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 col-lg-5 col-xl-4 panel-voltage panel-noborder">
                    <div class="subpanel" style="padding-bottom: 5px">
                      <div>THDi (%)</div>
                      <div class="huge-small" id="THDNow"></div>
                    </div>
                  </div>
                  <div class="col-md-6 col-lg-7 col-xl-8">
                    <div id="THDChart"></div>       
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 col-lg-5 col-xl-4 panel-voltage panel-noborder">
                    <div class="subpanel" style="padding-bottom: 5px">
                      <div class="huge-small">PHI (º)</div>
                      <div class="huge-small" id="PHINow">?</div>
                    </div>
                  </div>
                  <div class="col-md-6 col-lg-7 col-xl-8">
                    <div id="PHIChart"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.js"></script>
    <script src="lib/sidenav/sidenav.min.js"></script>
    <script src="lib/spin.min.js"></script>
    <script src="lib/dygraph/dygraph.js"></script>
    <script src="lib/dygraph/crosshair.js"></script>
    <script src="lib/dygraph/dygraph-interaction.js"></script>
    <script src="lib/dygraph/synchronize.js"></script>
    <script src="lib/dygraph/chart-plotter.js"></script>
    <script src="lib/offline.min.js"></script>
    <script src="lib/datatables/js/jquery.dataTables.js"></script>
    <script src="lib/datatables/js/dataTables.bootstrap.js"></script>
    <script src="lib/momentjs/moment.js"></script>
    <script src="lib/momentjs/moment-duration-format.js"></script>
    <script src="lib/chroma.min.js"></script>
    <script src="lib/jquery.scrolling-tabs.min.js"></script>
    <script src="openZmeter.js"></script>
    <script src="Analysis_Current.js"></script>

  </body>
</html>
