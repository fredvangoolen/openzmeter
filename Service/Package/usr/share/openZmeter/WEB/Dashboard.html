<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <base href="/">
    <link rel="shortcut icon" href="favicon.ico"/>
    <title>openZmeter - Dashboard</title>
    <script src="lib/pace.min.js"></script>
    <link rel="stylesheet" href="lib/pace.min.css">    
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" href="lib/datatables/css/dataTables.bootstrap.css" />
    <link rel="stylesheet" href="lib/sidenav/sidenav.min.css"/>
    <link rel="stylesheet" href="lib/font-awesome/css/font-awesome.css"/>
    <link rel="stylesheet" href="lib/jquery.lineProgressbar/jquery.lineProgressbar.css" type="text/css"/>
    <link rel="stylesheet" href="lib/offline.min.css" type="text/css"/>
    <link rel="stylesheet" href="openZmeter.css"/>
  </head>
  <body onload="StartPageLoad()">
    <span data-load-block="Header_Block"></span>
    <span data-load-block="AggregWarningDialog"></span>
    <span data-load-block="MaximizeDialog"></span>
    <div id="wrapper">
      <div class="row">
        <div class="col-lg-12">
          <div class="panel panel-active-energy" id="EnergyPanel">
            <div id="EnergySpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <div class="huge header-text">Energy consumption</div>
              <div class="header-buttons">
                <div class="btn-group" data-load-block="ScrollableAggreg_Block"></div>
                <div class="btn-group" data-load-block="ScrollableTime_Block"></div>
                <div class="btn-group" id="groupEnergyPhases" data-load-block="PhaseV_Block"></div>
                <div class="btn-group" data-load-block="GraphToolsPlay_Block"></div>
              </div>
              <span class="clearfix"></span>
            </div>
            <div class="panel-body">
              <div class="row">
                <div class="col-md-12 col-lg-4 col-xl-3">
                  <div class="subpanel" id="EnergyBox">
                    <div class="huge-small" id="labelEnergyPrimary">Loading data...</div>
                    <div><span id="labelEnergyPrimaryValue" class="huge">?</span>&nbsp;<em class="huge-small-unit" id="labelEnergyPrimaryUnits"></em></div>
                    <div id="labelEnergyPrimaryPhases"></div>
                    <div><span id="labelEnergySecondary">Loading data...</span>&nbsp;<span id="labelEnergySecondaryValue"></span></div>
                  </div>
                  <div class="subpanel" id="BudgetBox">
                    <h4><span id="labelBudgetPeriod">Today</span> budget</h4>
                    <span id="labelBudgetInteger" class="huge">?</span>
                    <span id="labelBudgetDecimal" class="huge-small"></span>&nbsp;<em class="huge-small-unit" id="labelBudgetUnits">€</em>
                    <p>Up to <span id="labelBudgetLastCalc">?</span></p>
                  </div>
                </div>
                <div class="col-md-12 col-lg-8 col-xl-9">
                  <div id="EnergyChart" class="chart big_chart"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="panel panel-voltage" id="VoltagePanel">
            <div id="VoltageSpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <div class="huge header-text">Voltage</div>
              <div class="header-buttons">
                <div><span id="labelVoltage" class="huge-small">?</span><em class="huge-small-unit">V</em></div>
                <div id="labelVoltageAggregation">Loading data...</div>
              </div>
            </div>
            <div class="panel-body">
              <div id="VoltageChart" class="chart"></div>
            </div>
            <div class="panel-footer">
              <a href="Analysis/Voltage">
                <span class="pull-left">View Details <i class="fa fa-arrow-circle-right"></i></span>
              </a>
              <div class="btn-group pull-right">
                <button type="button" class="btn btn-default btn-xs" id="btnExportVoltage" data-toggle="tooltip" title="Export data to CSV file">
                  <i class="fa fa-table fa-fw"></i>
                </button>
                <button type="button" class="btn btn-default btn-xs" id="btnMaximizeVoltage" data-toggle="tooltip" title="Maximize graph">
                  <i class="fa fa-expand"></i>
                </button>
              </div>
              <div class="pull-right">&nbsp;</div>
              <div class="btn-group pull-right hidden" id="groupVoltagePhases" data-load-block="PhaseV_Block"></div>
              <div class="clearfix"></div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="panel panel-current" id="CurrentPanel">
            <div id="CurrentSpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <div class="huge header-text">Current</div>
              <div class="header-buttons">
                <div><span id="labelCurrent" class="huge-small">?</span><em class="huge-small-unit">A</em></div>
                <div id="CurrentAggregation">Loading data...</div>
              </div>
            </div>
            <div class="panel-body">
              <div id="CurrentChart" class="chart"></div>
            </div>
            <div class="panel-footer">
              <a href="Analysis/Current">
                <span class="pull-left">View Details  <i class="fa fa-arrow-circle-right"></i></span>
              </a>
              <div class="btn-group pull-right">
                <button type="button" class="btn btn-default btn-xs" id="btnExportCurrent" data-toggle="tooltip" title="Export data to CSV file"><i class="fa fa-table fa-fw"></i></button>
                <button type="button" class="btn btn-default btn-xs pull-right" id="btnMaximizeCurrent"><i class="fa fa-expand"></i></button>
              </div>                
              <div class="pull-right">&nbsp;</div>
              <div class="btn-group pull-right" id="groupCurrentPhases" data-load-block="PhaseI_Block"></div>
              <div class="clearfix"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="panel panel-active-power" id="PowerPanel">
            <div id="PowerSpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <div class="huge header-text">Active&nbsp;power</div>
              <div class="header-buttons">
                <div><span id="labelPower" class="huge-small">?</span><em class="huge-small-unit" id="labelPowerUnits">W</em></div>
                <div id="PowerAggregation">Loading data...</div>
              </div>
            </div>
            <div class="panel-body">
              <div id="PowerMaximizeDiv">
                <div id="PowerChart" class="chart"></div>
              </div>
            </div>
            <div class="panel-footer">
              <a href="Analysis/EnergyPower">
                <span class="pull-left">View Details  <i class="fa fa-arrow-circle-right"></i></span>
              </a>
              <div class="btn-group pull-right">
                <button type="button" class="btn btn-default btn-xs" id="btnExportPower" data-toggle="tooltip" title="Export data to CSV file"><i class="fa fa-table fa-fw"></i></button>
                <button type="button" class="btn btn-default btn-xs pull-right" id="btnMaximizePower"><i class="fa fa-expand"></i></button>
              </div>
              <div class="pull-right">&nbsp;</div>
              <div class="btn-group pull-right" id="groupPowerPhases" data-load-block="PhaseV_Block"></div>
              <div class="clearfix"></div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="panel panel-frequency" id="FrequencyPanel">
            <div id="FrequencySpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <div class="huge header-text">Frequency</div>
              <div class="header-buttons">
                <div><span id="labelFrequency" class="huge-small"></span><em class="huge-small-unit">Hz</em></div>
                <div id="FrequencyAggregation">Loading data...</div>
              </div>
            </div>
            <div class="panel-body">
              <div id="FrequencyChart" class="chart"></div>
            </div>
            <div class="panel-footer">
              <a href="Analysis/Frequency">
                <span class="pull-left">View Details  <i class="fa fa-arrow-circle-right"></i></span>
              </a>
              <div class="btn-group pull-right">
                <button type="button" class="btn btn-default btn-xs" id="btnExportFrequency" data-toggle="tooltip" title="Export data to CSV file"><i class="fa fa-table fa-fw"></i></button>
                <button type="button" class="btn btn-default btn-xs pull-right" id="btnMaximizeFrequency"><i class="fa fa-expand"></i></button>
              </div>
              <div class="clearfix"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <div class="panel panel-other">
            <div id="MainParametersSpinner" class="spinnerdiv"></div>
            <div class="panel-heading">
              <div class="huge header-text">Parameters</div>
              <div class="header-buttons">
                <div class="btn-group" id="groupParametersPhases" data-load-block="PhaseV_Block"></div>
                <div id="labelParametersAggregation">Loading data...</div>
              </div>
              <span class="clearfix"></span>
            </div>
            <div id="EvolutionPanel" class="panel-body"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.js"></script>
    <script src="lib/sidenav/sidenav.min.js"></script>
    <script src="lib/spin.min.js"></script>
    <script src="lib/dygraph/dygraph.js"></script>
    <script src="lib/dygraph/crosshair.js"></script>
    <script src="lib/dygraph/dygraph-interaction.js"></script>
    <script src="lib/dygraph/chart-plotter.js"></script>
    <script src="lib/dygraph/synchronize.js"></script>
    <script src="lib/datatables/js/jquery.dataTables.js"></script>
    <script src="lib/datatables/js/dataTables.bootstrap.js"></script>
    <script src="lib/jquery.lineProgressbar/jquery.lineProgressbar.js"></script>
    <script src="lib/offline.min.js"></script>
    <script src="lib/momentjs/moment.js"></script>
    <script src="lib/momentjs/moment-duration-format.js"></script>
    <script src="lib/chroma.min.js"></script>
    <script src="openZmeter.js"></script>
    <script src="Dashboard.js"></script>
  </body>
</html>
