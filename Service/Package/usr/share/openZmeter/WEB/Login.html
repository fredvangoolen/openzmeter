<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="shortcut icon" href="favicon.ico" />
    <title>openZmeter | Login</title>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.css" type="text/css"/>
    <link rel="stylesheet" href="lib/font-awesome/css/font-awesome.css" type="text/css"/>
    <link rel="stylesheet" href="openZmeter.css" type="text/css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body, html {
        display: table;
        position: absolute;
        height: 100%;
        width: 100%;
        background-color: #474544;
        background-image: none;
      }
      .container {
        display: table-cell;
        vertical-align: middle;
        width: 100%;
      }
      .card {
        max-width: 350px;
        background-color: #F7F7F7;
        padding: 40px 40px 10px 40px;
        margin: auto;
      }
      .btn {
        background-color: #E8701C;
        font-weight: 700;
        color: #F7F7F7;
      }
      .panel-footer {
        text-align: center;
      }
      .alert {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div>
          <embed src="Logo.svg" style="width:100%" type="image/svg+xml" />
          <form class="form-signin" method="post">
            <div class="form-group">
              <input type="text" id="username" class="form-control" placeholder="Username" required autofocus>
            </div>
            <div class="form-group">
              <input type="password" id="password" class="form-control" placeholder="Password" required>
            </div>
            <button class="btn btn-block" type="submit">Sign in</button>
          </form>
        </div>
        <div class="alert alert-success text-center" style="display:none">
          <i class="fa fa-check"></i> Welcome again, redirecting...
        </div>
        <div class="alert alert-danger text-center" style="display:none">
          <i class="fa fa-times"></i> Wrong password!
        </div>
        <div class="panel-footer">
          zRed - 2018
        </div>
      </div>
    </div>
    <script src="lib/jquery/jquery.js"></script>
    <script src="Login.js"></script>
  </body>
</html>
