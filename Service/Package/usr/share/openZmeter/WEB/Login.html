<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="shortcut icon" href="favicon.ico" />
    <title>openZmeter | Login</title>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.css">
    <link href="lib/font-awesome/font-awesome.css" rel="stylesheet" type="text/css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body, html {
        display: table;
        position: absolute;
        height: 100%;
        width: 100%;
        background-color: #474544;
      }
      .container {
        display: table-cell;
        vertical-align: middle;
        width: 100%;
      }
      .card-container.card {
        max-width: 350px;
        padding: 0px;
      }
      .btn {
        background-color: #e8701c;
        font-weight: 700;
        height: 36px;
        -moz-user-select: none;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
        color: #FFF;
      }
      .subcard {
        padding: 40px 40px 0px 40px;
      }
      .card {
        background-color: #F7F7F7;
        padding: 20px 25px 30px;
        margin: 0 auto 25px;
        margin-top: 50px;
        -moz-border-radius: 2px;
        -webkit-border-radius: 2px;
        border-radius: 2px;
        -moz-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
        -webkit-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
        box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
      }
      .form-signin input[type=password], .form-signin input[type=text], .form-signin button {
        border-color: #cccccc;
        width: 100%;
        display: block;
        margin-bottom: 12px;
        position: relative;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
      }
      .form-signin .form-control:focus {
        -webkit-box-shadow: inset 0 1px 1px rgba(0,0,0,.075),0 0 8px #474544;
        box-shadow: inset 0 1px 1px rgba(0,0,0,.075),0 0 8px #474544;
      }
      .panel-footer {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card card-container">
        <div class="subcard">
        <embed src="Logo.svg" style="width:100%" type="image/svg+xml" />
        <form class="form-signin" method="post">
          <input type="text" id="username" class="form-control" placeholder="Username" required autofocus>
          <input type="password" id="password" class="form-control" placeholder="Password" required>
          <button class="btn" type="submit">Sign in</button>
          <div class="alert alert-success text-center" style="display:none">
            <i class="fa fa-check"></i> Welcome again, redirecting...
          </div>
          <div class="alert alert-danger text-center" style="display:none">
            <i class="fa fa-times"></i> Wrong password!
          </div>
        </form>
        </div>
        <div class="panel-footer">
        zRed - 2018
        </div>
      </div>
    </div>
    <script src="lib/jquery/jquery.js"></script>
    <script src="Login.js"></script>
  </body>
</html>
