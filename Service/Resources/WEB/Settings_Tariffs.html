<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <base href="/">
    <link rel="shortcut icon" href="Imgs/favicon.ico"/>
    <script src="JS/pace.min.js"></script>
    <link rel="stylesheet" href="CSS/pace.min.css">    
    <link rel="stylesheet" href="CSS/bootstrap.min.css"/>
    <link rel="stylesheet" href="CSS/dataTables.min.css" />
    <link rel="stylesheet" href="CSS/sidenav.min.css"/>
    <link rel="stylesheet" href="CSS/offline.min.css" type="text/css"/>
    <link rel="stylesheet" href="Lib/bootstrap-year-calendar/bootstrap-year-calendar.css" type="text/css"/>
    <link rel="stylesheet" href="CSS/bootstrap-toggle.min.css">
    <link rel="stylesheet" href="Lib/bootstrap-datetimepicker.min.css">
    <link rel="stylesheet" href="Lib/qtip2/jquery.qtip.css" type="text/css"/>
    <link rel="stylesheet" href="CSS/openZmeter.css"/>
    <title>openZmeter - Stats</title>
  </head>
  <body onload="StartPageLoad()">
    <span data-load-block="Header_Block"></span>
    <div id="wrapper">
      <div class="row">
        <div class="col-xs-12">
          <div class="panel panel-other">
            <div class="panel-heading">
              <div class="huge-small header-text">Year seasons templates</div>
              <div class="header-buttons">
                <div class="btn-group">
                  <button type="button" class="btn btn-default btn-xs" data-toggle="tooltip" title="Save changes"><img src="Imgs/plus.png"> Add</button>
                </div>
              </div>
            </div>
            <div class="panel-body">
              <table id="DeviceTable" class="table small table-striped table-responsive">
                <thead><tr><th style="width: 40px">Driver</th><th>Description</th><th style="width: 250px">Serial</th><th style="width: 20px">Analyzers</th><th style="width: 90px">Status</th><th style="width: 180px"></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-xs-12">
          <div class="panel panel-other">
            <div class="panel-heading">
              <div class="huge-small header-text">Day periods templates</div>
              <div class="header-buttons">
                <div class="btn-group">
                  <button type="button" class="btn btn-default btn-xs" data-toggle="tooltip" title="Save changes"><img src="Imgs/plus.png"> Add</button>
                </div>
              </div>
            </div>
            <div class="panel-body">
              <table id="DeviceTable" class="table small table-striped table-responsive">
                <thead><tr><th style="width: 40px">Driver</th><th>Description</th><th style="width: 250px">Serial</th><th style="width: 20px">Analyzers</th><th style="width: 90px">Status</th><th style="width: 180px"></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-xs-12">
          <div class="panel panel-other">
            <div class="panel-heading">
              <div class="huge-small header-text">Tariffs</div>
              <div class="header-buttons">
                <div class="btn-group">
                  <button type="button" class="btn btn-default btn-xs" data-toggle="tooltip" title="Save changes"><img src="Imgs/plus.png"> Add</button>
                </div>
              </div>
            </div>
            <div class="panel-body">
                <table id="TariffsTable" class="table small table-striped table-responsive">
                  <thead><tr><th style="width: 40px">Module</th><th>Name</th><th>Description</th><th style="width: 20px">Company</th><th style="width: 90px"></th><th style="width: 180px"></th></tr></thead>
                  <tbody>
                  </tbody>
                </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="JS/jquery.min.js"></script>
    <script src="JS/bootstrap.min.js"></script>
    <script src="JS/sidenav.min.js"></script>
    <script src="JS/spin.min.js"></script>
    <script src="JS/offline.min.js"></script>
    <script src="JS/dataTables.min.js"></script>
    <script src="JS/dataTables.bootstrap.min.js"></script>
    <script src="JS/moment.min.js"></script>
    <script src="JS/moment-duration-format.min.js"></script>
    <script src="Lib/moment-timezone.min.js"></script>
    <script src="JS/bootstrap-toggle.min.js"></script>
    <script src="Lib/bootstrap-datetimepicker.min.js"></script>
    <script src="JS/openZmeter.js"></script>
    <script src="JS/openZmeter.Settings.js"></script>
  </body>
</html>
