image: registry.gitlab.com/zredalmeria/openzmeter/openwrt_nanopi_air

stages:
  - build

build:
  stage: build
  tags: devel
  cache:
    paths:
      - Service/WEB/node_modules
  artifacts:
    paths:
      - Service/Tmp/openZmeter
  script:
    - cd Service
    - make CONFIG=Configs/openWRT.config
